name: Buyer mobile

on:
  workflow_dispatch:
  push:
    paths: ['helacart_buyer_mobile_app/**', '.github/workflows/buyer-mobile.yml']
  pull_request:
    paths: ['helacart_buyer_mobile_app/**', '.github/workflows/buyer-mobile.yml']

permissions:
  contents: read

concurrency:
  group: buyer-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: helacart_buyer_mobile_app
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      # The 1.1.0 release added packages (firebase_messaging, firebase_crashlytics,
      # share_plus, package_info_plus, url_launcher, path_provider,
      # flutter_localizations). Run `flutter pub get` locally once and commit the
      # regenerated pubspec.lock; CI then verifies that exact resolution.
      - run: flutter pub get --enforce-lockfile
      - run: dart run build_runner build
      - run: git diff --exit-code -- lib/core/data/models.freezed.dart lib/core/data/models.g.dart
      - run: dart format --output=none --set-exit-if-changed lib test tool
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug --target-platform android-arm64 --split-per-abi
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: helacart-buyer-debug-arm64
          path: helacart_buyer_mobile_app/build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk
          retention-days: 7

  # Secrets are not available in job-level `if:` expressions, so this job
  # reports whether the Android upload-signing secrets are configured.
  release-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      android: ${{ steps.check.outputs.android }}
    steps:
      - id: check
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] \
            && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "android=true" >> "$GITHUB_OUTPUT"
          else
            echo "android=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Android release signing secrets are not configured; the signed app bundle is skipped."
          fi

  release-android:
    needs: [verify-android, release-secrets]
    if: needs.release-secrets.outputs.android == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: helacart_buyer_mobile_app
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Write upload keystore and key.properties
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > android/key.properties
      - name: Write Firebase and app configuration (optional secrets)
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          MOBILE_PROD_CONFIG_JSON: ${{ secrets.MOBILE_PROD_CONFIG_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
          fi
          if [ -n "$MOBILE_PROD_CONFIG_JSON" ]; then
            printf '%s' "$MOBILE_PROD_CONFIG_JSON" > config/prod.json
          else
            cp config/prod.example.json config/prod.json
          fi
      - run: flutter build appbundle --release --dart-define-from-file=config/prod.json
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: helacart-buyer-release-aab
          path: helacart_buyer_mobile_app/build/app/outputs/bundle/release/app-release.aab
          retention-days: 7
      - name: Remove signing material
        if: always()
        run: rm -f android/key.properties android/app/upload-keystore.jks android/app/google-services.json config/prod.json

  build-ios:
    needs: verify-android
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: helacart_buyer_mobile_app
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      # Compile check only: no signing identity, provisioning profile or
      # GoogleService-Info.plist is used in CI.
      - run: flutter build ios --release --no-codesign --dart-define-from-file=config/prod.example.json
